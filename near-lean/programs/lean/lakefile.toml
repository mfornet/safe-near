name = "Programs"
version = "0.1.0"
defaultTargets = ["Programs"]
packagesDir = "../../.lake/packages"

# CodeLib (../../iris-wasm) re-exports the interpreter (../../wasm) and adds
# the Iris separation-logic layer, Rust std lemmas and the elaborators that
# splice ../rust/build/<crate>/program.wat into each Program.lean.
[[require]]
name = "CodeLib"
path = "../../iris-wasm"

# Generated Wasm modules of ../rust (one `Programs.<Crate>.Program` each),
# their specifications and completed correctness theorems.
[[lean_lib]]
name = "Programs"

# Runs every program under the interpreter's stdio host on small inputs and
# checks the output bytes. `lake exe smoke`.
[[lean_exe]]
name = "smoke"
root = "Programs.Smoke"

# Exhaustive small inputs, stream boundaries and explicit harness failures.
[[lean_exe]]
name = "program-tests"
root = "Programs.Regression"
