name: wasm

# Expensive validation is opt-in. Run `just periodic-check <nearcore>` locally.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, smoke test, and check testsuite_report.txt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Only the spec testsuite is needed; the contracts/*/source submodules are large.
      - run: git submodule update --init near-lean/wasm/vendor/testsuite

      # The runtime depends on nothing beyond core Lean: no package cache needed.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: near-lean/wasm
          build-args: Wasm testsuite wasm --wfail
          use-mathlib-cache: false

      # Must match the pin in near-lean/wasm/scripts/testsuite-report.sh.
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.251.0

      - name: Decode and validate the deployed wNEAR binary
        working-directory: near-lean/wasm
        run: ./.lake/build/bin/wasm validate ../../contracts/w-near/contract.wasm

      - name: Regenerate testsuite_report.txt
        run: near-lean/wasm/scripts/testsuite-report.sh

      - name: Verify testsuite_report.txt is unchanged
        run: |
          if ! git diff --exit-code near-lean/wasm/testsuite_report.txt; then
            echo "::error::near-lean/wasm/testsuite_report.txt is out of date. Run scripts/testsuite-report.sh and commit the result."
            exit 1
          fi

      # The separation logic over the runtime (near-lean/wasm-logic) has its
      # own workflow, wasm-logic.yml, which runs when it or the runtime changes.

      # Every declaration may depend only on propext, Classical.choice and
      # Quot.sound: no sorry, no native_decide.
      - name: Axiom audit (no sorry, no native_decide)
        run: |
          python3 tools/axiom-audit.py near-lean/wasm --report audit/wasm.json --no-build

  near-runtime:
    name: VM, runtime and chain scenarios and axiom audits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: near-lean/.lake/packages
          key: lake-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('near-lean/**/lean-toolchain', 'near-lean/**/lake-manifest.json', 'contracts/*/verification/lean-toolchain', 'contracts/*/verification/lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: near-lean/vm
          build-args: NearVM vm-tests vm-replay
          use-mathlib-cache: true
      - name: VM scenarios
        working-directory: near-lean/vm
        run: ./.lake/build/bin/vm-tests
      - name: Check the VM execution dependency boundary
        run: |
          python3 tools/check_vm_dependencies.py --no-build
          python3 tools/tests/check_vm_dependencies.py
      - name: Runtime scenarios
        working-directory: near-lean/runtime
        run: |
          lake build NearRuntime runtime-tests finance-replay nonce-replay allowance-replay staking-key-replay trie-replay --wfail
          ./.lake/build/bin/runtime-tests
      - name: Chain scenarios
        working-directory: near-lean/chain
        run: |
          lake build NearChain chain-tests chain-replay --wfail
          ./.lake/build/bin/chain-tests
      - name: Chain JSON replay
        run: python3 tools/chain-conformance/test_replay.py
      - name: Runtime axiom audits
        run: |
          python3 tools/tests/check_axiom_audit.py
          python3 tools/axiom-audit.py near-lean/interface --report audit/interface.json --no-build
          python3 tools/axiom-audit.py near-lean/vm --report audit/vm.json --no-build
          python3 tools/axiom-audit.py near-lean/runtime --report audit/runtime.json --no-build
          python3 tools/axiom-audit.py near-lean/chain --report audit/chain.json --no-build
      - name: wNEAR runtime observation adapter
        working-directory: contracts/w-near/verification
        run: |
          lake build Spec runtime-adapter-tests --wfail
          ./.lake/build/bin/runtime-adapter-tests
          lake build Model Proofs
      - name: wNEAR model proof axioms
        run: python3 tools/axiom-audit.py contracts/w-near/verification --no-build --allow-sorry-module Proofs.Refinement --report audit/wnear.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-axiom-audits
          path: audit/

  runtime-conformance:
    name: Exact VM comparison with pinned nearcore
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: near-lean/.lake/packages
          key: lake-conformance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('near-lean/**/lean-toolchain', 'near-lean/**/lake-manifest.json', 'contracts/*/verification/lean-toolchain', 'contracts/*/verification/lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: near-lean/vm
          build-args: vm-replay
          use-mathlib-cache: true
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/runtime-conformance
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.251.0
      - name: Verify all generated runtime configuration tables
        run: |
          cargo run --locked --release --manifest-path tools/dump-runtime-config/Cargo.toml -- /tmp/safe-near-runtime-configs
          python3 tools/check_runtime_configs.py /tmp/safe-near-runtime-configs
      - name: Verify chain replay and storage input Wasm fixtures
        run: |
          wasm-tools parse tools/chain-conformance/fixtures/replay.wat -o /tmp/safe-near-replay.wasm
          cmp tools/chain-conformance/fixtures/replay.wasm /tmp/safe-near-replay.wasm
          wasm-tools parse tools/chain-conformance/fixtures/stateful.wat -o /tmp/safe-near-stateful.wasm
          cmp tools/chain-conformance/fixtures/stateful.wasm /tmp/safe-near-stateful.wasm
          wasm-tools parse tools/runtime-conformance/fixtures/storage_inputs.wat -o /tmp/safe-near-storage-inputs.wasm
          cmp tools/runtime-conformance/fixtures/storage_inputs.wasm /tmp/safe-near-storage-inputs.wasm
      - name: Compare all VM observations
        run: |
          python3 -m unittest discover -s tools/runtime-conformance
          python3 tools/runtime-conformance/compare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-conformance-evidence
          path: audit/runtime-conformance.json
