name = "SputnikDAO2Verification"
version = "0.1.0"
defaultTargets = ["Model", "Proofs"]

# Share build outputs between checkouts (worktrees, CI runs) through Lake's
# artifact cache, and keep them in .lake/build, where our tools look for them.
enableArtifactCache = true
restoreAllArtifacts = true

# Borsh and near-sdk collection layouts shared with the other contract projects.
[[require]]
name = "NearSdk"
path = "../../../near-lean/sdk"

[[lean_lib]]
name = "Model"

[[lean_lib]]
name = "Proofs"
