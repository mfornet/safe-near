# Rust programs compiled to Wasm and run under the near-lean WASM interpreter.
# Copied from Talos `programs/rust/` (see ../README.md); only the stream
# programs selected for near-lean are kept.
[workspace]
resolver = "2"
members = [
  "talos_stdio",
  "gcd_talos_stdio",
  "byte_echo",
  "gcd_stdio",
  "mergesort",
]

[profile.release]
opt-level = 0
lto = false
codegen-units = 1

# The host-I/O examples and their shared support crates use rustc's maximum
# optimization level. `codegen-units = 1` is inherited from the release
# profile above.
[profile.release.package.mergesort]
opt-level = 3

[profile.release.package.talos-stdio]
opt-level = 3

[profile.release.package.gcd-talos-stdio]
opt-level = 3

[profile.release.package.byte_echo]
opt-level = 3

[profile.release.package.gcd_stdio]
opt-level = 3
