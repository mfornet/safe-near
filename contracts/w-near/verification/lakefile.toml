# Verification of the wNEAR contract (`wrap.near`, contracts/w-near/contract.wasm).
#
# Three libraries, following notes/design/PROJECT_STRUCTURE.md:
#   Model/   the high-level model of the contract state and of every method
#   Spec/    the properties we want to prove, as `def ... : Prop`
#   Proofs/  one theorem per spec
#
# Packages are shared with near-lean (same toolchain, same mathlib checkout).
name = "WNearVerification"
version = "0.1.0"
defaultTargets = ["Model", "Spec", "Proofs"]
packagesDir = "../../../near-lean/.lake/packages"

# Share build outputs between checkouts (worktrees, CI runs) through Lake's
# artifact cache, and keep them in .lake/build, where our tools look for them.
enableArtifactCache = true
restoreAllArtifacts = true

# Lean blueprint extracted from `@[blueprint]` annotations (notes/design/PROVING.md).
# `lake build :blueprint` writes .lake/build/blueprint/, consumed by blueprint/src.
# The NEAR runtime in Lean: `Near.Boundary.nearRuntime` is the
# `NearInterface.RuntimeInterface` the refinement obligation is stated against.
[[require]]
name = "NearRuntime"
path = "../../../near-lean/runtime"

# Borsh and near-sdk collection layouts shared with the other contract projects.
# The metered separation logic (layer L1) and the generic bridge to `Refines`.
[[require]]
name = "NearLogic"
path = "../../../near-lean/near-logic"

[[require]]
name = "NearSdk"
path = "../../../near-lean/sdk"

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "v4.34.0"

# Keep Mathlib last so its transitive dependency sources take precedence over
# LeanArchitect's (notably the old lean4-cli URL), as required by its cache.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "Model"

# The deployed binary in the kernel: its bytes, each function's body as decoded,
# and the module (milestone M0 of notes/todo/wnear_refinement_proof.md).
[[lean_lib]]
name = "Binary"

# The bridge from the binary to `Refines` (layer L2, wNEAR part): facts about runs
# of `contract.wasm` in the metered logic.
[[lean_lib]]
name = "Bridge"
# There is no umbrella module; include every proof under Bridge/.
globs = ["Bridge.+"]

[[lean_lib]]
name = "Spec"

[[lean_lib]]
name = "Proofs"

[[lean_exe]]
name = "runtime-adapter-tests"
root = "RuntimeTests.Main"

# Differential scenarios (`Differential/`, `scenarios/`): timelines of receipts run
# on the binary and on the model, checked against `Refines` at every step.
[[lean_lib]]
name = "Differential"

[[lean_exe]]
name = "wnear-scenarios"
root = "Differential.Main"

# The internal-function harness (milestone M1 of notes/todo/wnear_refinement_proof.md):
# runs one function of the binary from a prepared store and checks its contract.
[[lean_lib]]
name = "Harness"

[[lean_exe]]
name = "wnear-harness"
root = "Harness.Main"

# Curated LeanArchitect frontier and checked global composition.
[[lean_lib]]
name = "Blueprint"
