name: near-lean

# Builds the chain package, which builds every package below it (interface,
# vm, runtime, crypto, wasm), on every change to them. Nothing else builds
# these packages automatically, so a broken `main` used to go unnoticed until
# the periodic check (SAF-50). Tests, conformance and audits stay in the
# periodic check. The runner keeps its workspace, .lake builds included
# (notes/design/CI_RUNNER.md), so a typical change rebuilds only the modules it
# touches; a cold build takes much longer.
on:
  push:
    branches: [main]
    paths:
      - "near-lean/**"
      - "!near-lean/wasm-logic/**"
      - "lean-toolchain"
      - ".github/workflows/near-lean.yml"
  pull_request:
    paths:
      - "near-lean/**"
      - "!near-lean/wasm-logic/**"
      - "lean-toolchain"
      - ".github/workflows/near-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: near-lean-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the chain package and everything below it
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      - name: Clean sources and previous evidence; keep build caches
        run: |
          git clean -ffd
          git clean -ffdX -- audit/

      # The libraries, the tests and the replay executables (ChainReplay), whose missing case
      # broke `main` in the 2026-10-23 check.
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          lake-package-directory: near-lean/chain
          build-args: NearChain chain-tests chain-replay registered-replay --wfail
          use-mathlib-cache: true

      # The near-sdk layout library the contract projects share. After lean-action, which
      # installs Lean.
      - name: Build the sdk package
        working-directory: near-lean/sdk
        run: lake build NearSdk --wfail
