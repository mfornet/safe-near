name: Lean quality

on:
  push:
    branches: [main]
    paths: ["**/*.lean", "**/lean-toolchain", "lean-toolchain", "lean-fmt.toml", "**/lakefile.*", "**/lake-manifest.json", "tools/**", ".github/workflows/lean-quality.yml"]
  pull_request:
    paths: ["**/*.lean", "**/lean-toolchain", "lean-toolchain", "lean-fmt.toml", "**/lakefile.*", "**/lake-manifest.json", "tools/**", ".github/workflows/lean-quality.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  toolchains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check all repository-owned Lean pins
        run: python3 tools/check_lean_toolchains.py
      - name: Test repository tooling
        run: python3 -m unittest discover -s tools/tests -v

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: near-lean/.lake/packages
          key: lean-style-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'near-lean/wasm/lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: near-lean/wasm
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: false
      - name: Prepare only the style checker's dependencies
        working-directory: near-lean/wasm
        run: |
          lake exe cache get Mathlib.Tactic.Linter.TextBased
          lake build +Mathlib.Tactic.Linter.TextBased
      - name: Check Lean style and formatting
        run: python3 tools/lean_style.py
      - name: Test style checker and formatter
        run: python3 tools/tests/check_lean_style.py

  programs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: near-lean/.lake/packages
          key: lean-programs-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'near-lean/**/lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: near-lean/programs/lean
          build-args: program-tests smoke
          use-mathlib-cache: false
      - name: Smoke and program regression tests
        working-directory: near-lean/programs/lean
        run: |
          ./.lake/build/bin/smoke
          ./.lake/build/bin/program-tests
      - uses: actions/cache@v5
        with:
          path: near-lean/.lake/lean-fmt
          key: lean-fmt-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'tools/lean_format_tool.json') }}
      - name: Check syntax formatting of the new harness modules
        run: >-
          python3 tools/lean_format.py --check
          near-lean/programs/lean/Programs/Harness.lean
          near-lean/programs/lean/Programs/Regression.lean
      - name: Test validated syntax formatting
        run: python3 tools/tests/check_lean_format.py
