# NearChain: the trustless manipulator.
#
# Blocks of transactions applied with NearRuntime (../runtime); reachable
# states, receipts in flight, isolation of one transaction's receipt chain,
# and the predicates specifications use to talk about transitions (touching
# an account, upgrading a contract, and measured burnt gas).
name = "NearChain"
version = "0.1.0"
defaultTargets = ["NearChain"]
packagesDir = "../.lake/packages"

# Share build outputs between checkouts (worktrees, CI runs) through Lake's
# artifact cache, and keep them in .lake/build, where our tools look for them.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "NearRuntime"
path = "../runtime"

# Delegate-action signatures are checked with the crypto package's verifiers (the runtime takes the
# check as an injected function and depends on no signature scheme).
[[require]]
name = "NearCrypto"
path = "../crypto"

[[lean_lib]]
name = "NearChain"

# `lake exe chain-tests`: isolation, completion, reachability and measured gas.
[[lean_exe]]
name = "chain-tests"
root = "Tests.Main"

# Trusted JSON block replay for the independent runtime comparison bridge.
[[lean_lib]]
name = "ChainReplay"

[[lean_exe]]
name = "chain-replay"
root = "ChainReplay.Main"

# Queue-free model records to native trie bytes, root and complete object set.
[[lean_exe]]
name = "state-encode"
root = "ChainReplay.StateEncoding"

[[lean_exe]]
name = "receipt-encode"
root = "ChainReplay.ReceiptEncoding"

# Original typed transaction bodies and automatic admitted-receipt registration.
[[lean_exe]]
name = "transaction-replay"
root = "ChainReplay.Transactions"

# Actual receipt/data births and persisted queue identities through block execution.
[[lean_exe]]
name = "registered-replay"
root = "ChainReplay.Registered"

[[lean_exe]]
name = "receipt-replay"
root = "ChainConformance.Receipts"
