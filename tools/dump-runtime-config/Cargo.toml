[package]
name = "dump-runtime-config"
version = "0.1.0"
edition = "2021"
description = "Dump nearcore RuntimeConfig as JSON for given protocol versions"
publish = false

# Standalone crate: not part of any workspace.
[workspace]

[dependencies]
near-parameters = "=0.37.4"
near-primitives-core = "=0.37.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
