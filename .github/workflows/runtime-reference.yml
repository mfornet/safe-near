name: Runtime reference components

# Expensive validation is opt-in. Run `just periodic-check <nearcore>` locally.
on:
  workflow_dispatch:

permissions:
  contents: read

# Finish cold builds so their caches survive frequent pushes. GitHub keeps the
# latest pending run while allowing the current run to complete.
concurrency:
  group: runtime-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:

  runtime-finance-conformance:
    name: Financial, nonce and receipt-result checks against pinned nearcore
    runs-on: [self-hosted, fv01]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      - run: git clean -ffd
      - uses: actions/checkout@v5
        with:
          repository: near/nearcore
          clean: false
          ref: 44f7ae6cd7ef08bab604e20a473bf77e35d4c993
          path: reference-nearcore
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          lake-package-directory: near-lean/runtime
          build-args: finance-replay nonce-replay allowance-replay --wfail
          use-mathlib-cache: true
      - name: Build receipt-chain replay
        run: cd near-lean/chain && lake build receipt-replay --wfail
      # The native build dependencies (clang, cmake, protobuf, ...) are installed
      # on the fv01 runner host; see notes/design/CI_RUNNER.md.
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Build reference adapter and compare financial observations
        run: |
          python3 tools/runtime-finance-reference/build.py reference-nearcore
          python3 tools/runtime-finance-reference/compare.py reference-nearcore/target/debug/safe-near-finance-reference
          python3 tools/runtime-finance-reference/compare_allowance.py reference-nearcore/target/debug/safe-near-finance-reference
          python3 tools/runtime-nonce-reference/build.py reference-nearcore
          python3 tools/runtime-nonce-reference/compare.py reference-nearcore/target/debug/safe-near-nonce-reference
      - name: Compare receipt-result delivery through actual native and Lean runtimes
        run: |
          python3 tools/runtime-receipt-reference/build.py reference-nearcore
          python3 tools/runtime-receipt-reference/compare.py reference-nearcore/target/debug/safe-near-receipt-reference --scope receipt-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-conformance
          path: |
            audit/finance*.json
            audit/nonce*.json
            audit/allowance*.json
            audit/receipt*.json
