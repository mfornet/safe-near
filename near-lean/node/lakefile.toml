# NearNode: a full NEAR validator node (notes/design/NEAR_NODE.md).
#
# Wire types, chain and epoch management, consensus, networking and storage on
# top of NearChain (../chain). Nothing depends on this package: contract
# verification never builds it (`just node-isolation`).
name = "NearNode"
version = "0.1.0"
defaultTargets = ["NearNode", "near-lean-node", "node-conformance-types", "node-conformance-network", "node-trie-tests", "node-store-tests", "node-net-tests", "node-state-roots", "node-chain-validate", "node-chain-apply"]
packagesDir = "../.lake/packages"

[[require]]
name = "NearChain"
path = "../chain"

[[require]]
name = "NearCrypto"
path = "../crypto"

[[lean_lib]]
name = "NearNode"

[[lean_exe]]
name = "near-lean-node"
root = "NearNode.Cli"

# `lake exe node-bench`: timing of node hot paths, written as JSON.
[[lean_lib]]
name = "NodeBench"

[[lean_exe]]
name = "node-bench"
root = "NodeBench.Main"

# `lake exe node-conformance-types`: Borsh codecs against the nearcore oracle fixtures.
[[lean_lib]]
name = "NodeConformance"

[[lean_exe]]
name = "node-conformance-types"
root = "NodeConformance.Types"

# `lake exe node-conformance-network [DIR]`: the peer protocol against the nearcore network oracle fixtures.
[[lean_exe]]
name = "node-conformance-network"
root = "NodeConformance.Network"

# `lake exe node-trie-tests`: the trie `Impl` against `Spec` on seeded random entry sets and updates.
[[lean_lib]]
name = "NodeTests"

[[lean_exe]]
name = "node-trie-tests"
root = "NodeTests.TrieTests"

# `lake exe node-net-tests`: the framing and the transports (memory and libuv TCP) behind NearNode.Net.
[[lean_exe]]
name = "node-net-tests"
root = "NodeTests.NetTests"

# `lake exe node-state-roots DIR`: the state roots of the M3 corpus through the trie.
[[lean_exe]]
name = "node-state-roots"
root = "NodeConformance.StateRoots"

# `lake exe node-store-tests [CASES [CHUNKS]]`: the persistent store, crash recovery and restarts.
[[lean_exe]]
name = "node-store-tests"
root = "NodeTests.StoreTests"

# `lake exe node-chain-validate DIR`: the blocks of a localnet corpus through the chain validator.
[[lean_exe]]
name = "node-chain-validate"
root = "NodeConformance.ChainValidate"

# `lake exe node-chain-apply DIR`: a localnet chain run from genesis by the node (epochs, chunks, restart).
[[lean_exe]]
name = "node-chain-apply"
root = "NodeConformance.ChainApply"
