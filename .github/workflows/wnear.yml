name: wNEAR

# Builds the wNEAR verification project and runs its axiom audit with the
# pinned statements (contracts/w-near/verification/STATEMENTS.md) on every
# change that can reach them. A proof that still compiles because its statement
# was weakened fails here, unless the pull request also updates STATEMENTS.md
# (`just wnear-pin-statements`), where the change is reviewed.
on:
  push:
    branches: [main]
    paths:
      - "contracts/w-near/verification/**"
      - "near-lean/**"
      - "tools/axiom-audit.py"
      - "tools/proof_sources.py"
      - "tools/wnear_blueprint.py"
      - "tools/tests/test_wnear_blueprint.py"
      - "lean-toolchain"
      - ".github/workflows/wnear.yml"
  pull_request:
    paths:
      - "contracts/w-near/verification/**"
      - "near-lean/**"
      - "tools/axiom-audit.py"
      - "tools/proof_sources.py"
      - "tools/wnear_blueprint.py"
      - "tools/tests/test_wnear_blueprint.py"
      - "lean-toolchain"
      - ".github/workflows/wnear.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnear-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    name: Axioms and pinned statements of the wNEAR proofs
    runs-on: [self-hosted, fv01]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      - name: Clean sources and previous evidence; keep build caches
        run: |
          git clean -ffd
          git clean -ffdX -- audit/

      # Every module of the package: the audit fails on a missing one. The near-lean
      # packages below it come from Lake's artifact cache when another job built them.
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          lake-package-directory: contracts/w-near/verification
          build-args: Model Spec Proofs Bridge Blueprint Differential runtime-adapter-tests wnear-scenarios wnear-harness
          use-mathlib-cache: true

      - name: Build and audit the metered logic
        run: |
          (cd near-lean/near-logic && lake build NearLogic)
          python3 tools/axiom-audit.py near-lean/near-logic --no-build --report audit/near-logic.json

      - name: Audit axioms and check the pinned statements
        run: >-
          python3 tools/axiom-audit.py contracts/w-near/verification
          --allow-sorry-module Proofs.Refinement --report audit/wnear.json
          --statements contracts/w-near/verification/statements.json

      - name: Check the exact named proof frontier
        run: |
          python3 tools/wnear_blueprint.py --check --audit-report audit/wnear.json
          python3 -m unittest discover -s tools/tests -p 'test_wnear_blueprint.py'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wnear-audit
          path: audit/
