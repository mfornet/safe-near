# Verification of the wNEAR contract (`wrap.near`, contracts/w-near/contract.wasm).
#
# Three libraries, following notes/design/PROJECT_STRUCTURE.md:
#   Model/   the high-level model of the contract state and of every method
#   Spec/    the properties we want to prove, as `def ... : Prop`
#   Proofs/  one theorem per spec
#
# Packages are shared with near-lean (same toolchain, same mathlib checkout).
name = "WNearVerification"
version = "0.1.0"
defaultTargets = ["Model", "Spec", "Proofs"]
packagesDir = "../../../near-lean/.lake/packages"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

# Lean blueprint extracted from `@[blueprint]` annotations (notes/design/PROVING.md).
# `lake build :blueprint` writes .lake/build/blueprint/, consumed by blueprint/src.
# The NEAR runtime in Lean: `Near.Boundary.nearRuntime` is the
# `NearInterface.RuntimeInterface` the refinement obligation is stated against.
[[require]]
name = "NearRuntime"
path = "../../../near-lean/runtime"

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "v4.34.0"

[[lean_lib]]
name = "Model"

[[lean_lib]]
name = "Spec"

[[lean_lib]]
name = "Proofs"

[[lean_exe]]
name = "runtime-adapter-tests"
root = "RuntimeTests.Main"

# Differential scenarios (`Differential/`, `scenarios/`): timelines of receipts run
# on the binary and on the model, checked against `Refines` at every step.
[[lean_lib]]
name = "Differential"

[[lean_exe]]
name = "wnear-scenarios"
root = "Differential.Main"
