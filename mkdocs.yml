# Documentation site for Safe NEAR. Build with `uv run mkdocs serve`.
#
# docs/human/   is written by humans only (see docs/human/AGENTS.md)
# docs/*.md     everything else may be AI generated
# contracts/    README/CATALOG files are pulled into the site by tools/mkdocs_hooks.py
site_name: Safe NEAR
site_description: Formal verification of NEAR smart contracts in Lean
repo_url: https://github.com/mfornet/safe-near
repo_name: safe-near
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  icon:
    logo: material/shield-check
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Human notes:
      - Safe NEAR plan: human/SAFE_NEAR.md
      - NEAR model and specifications: human/NEAR_MODEL.md
      - Project structure: human/PROJECT_STRUCTURE.md
      - TODO: human/TODO.md
      - Policy for this section: human/AGENTS.md
  # "Contracts dataset" is appended by tools/mkdocs_hooks.py from contracts/

hooks:
  - tools/mkdocs_hooks.py

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
