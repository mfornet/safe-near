name: Runtime reference components

on:
  push:
    branches: [main]
    paths: ["near-lean/runtime/**", "near-lean/vm/**", "tools/runtime-finance-reference/**", "tools/runtime-nonce-reference/**", "tools/dump-runtime-config/**", ".github/workflows/runtime-reference.yml"]
  pull_request:
    paths: ["near-lean/runtime/**", "near-lean/vm/**", "tools/runtime-finance-reference/**", "tools/runtime-nonce-reference/**", "tools/dump-runtime-config/**", ".github/workflows/runtime-reference.yml"]
  workflow_dispatch:

# Finish cold builds so their caches survive frequent pushes. GitHub keeps the
# latest pending run while allowing the current run to complete.
concurrency:
  group: runtime-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:

  runtime-finance-conformance:
    name: Financial settlement and nonce validation against pinned nearcore
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: near/nearcore
          ref: 44f7ae6cd7ef08bab604e20a473bf77e35d4c993
          path: reference-nearcore
      - name: Reclaim unused SDK space before Lean and nearcore builds
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: actions/cache@v5
        with:
          path: near-lean/.lake/packages
          key: lake-finance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('near-lean/*/lean-toolchain', 'near-lean/*/lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: near-lean/runtime
          build-args: finance-replay nonce-replay --wfail
          use-mathlib-cache: true
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake protobuf-compiler libssl-dev pkg-config libzstd-dev
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reference-nearcore/target
          key: finance-nearcore-${{ runner.os }}-${{ runner.arch }}-44f7ae6-1.93.0-debug0-v2
      - name: Build reference adapter and compare financial observations
        run: |
          python3 tools/runtime-finance-reference/build.py reference-nearcore
          python3 tools/runtime-finance-reference/compare.py reference-nearcore/target/debug/safe-near-finance-reference
          python3 tools/runtime-nonce-reference/build.py reference-nearcore
          python3 tools/runtime-nonce-reference/compare.py reference-nearcore/target/debug/safe-near-nonce-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-conformance
          path: |
            audit/finance*.json
            audit/nonce*.json
