[package]
name = "node-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
borsh = "1"
curve25519-dalek = { version = "=4.1.3", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["hazmat"] }
near-crypto = "=0.37.4"
near-primitives = { version = "=0.37.4", features = ["rand"] }
near-primitives-core = "=0.37.4"
ordered-float = "4"
rand = "0.8"
rand_chacha = "0.3"
ripemd = "0.1"
serde_json = "1"
sha2 = "=0.10.9"
sha3 = "=0.10.9"

[[bin]]
name = "node-conformance-fixtures"
path = "src/main.rs"

[[bin]]
name = "crypto-fixtures"
path = "src/crypto_fixtures.rs"

[[bin]]
name = "crypto-bench"
path = "src/crypto_bench.rs"
