# NearRuntime: the NEAR transaction runtime at the `Runtime::apply` seam.
#
# Accounts, access keys, receipts, actions, fees and refunds on top of
# NearVM (../vm). `apply` takes a chain state, transactions and incoming
# receipts and returns the new state, the outgoing receipts and one
# execution outcome per transaction and receipt, as nearcore does.
name = "NearRuntime"
version = "0.1.0"
defaultTargets = ["NearRuntime"]
packagesDir = "../.lake/packages"

[[require]]
name = "NearVM"
path = "../vm"

[[lean_lib]]
name = "NearRuntime"

# Test helpers have an explicit root so imports do not resolve into another
# package's Tests namespace. They are not part of the runtime library.
[[lean_lib]]
name = "RuntimeTests"
roots = ["Tests.Decoder", "Tests.Gas"]

# Scenario tests: `lake exe runtime-tests`. Deploys the real wNEAR binary and
# drives it with transactions, checking balances, receipts, refunds and the
# conservation of NEAR.
[[lean_exe]]
name = "runtime-tests"
root = "Tests.Main"

[[lean_exe]]
name = "finance-replay"
root = "RuntimeConformance.Finance"

[[lean_exe]]
name = "nonce-replay"
root = "RuntimeConformance.Nonce"

[[lean_exe]]
name = "allowance-replay"
root = "RuntimeConformance.Allowance"

# Pure compressed Edwards/subgroup classification at the native staking boundary.
[[lean_exe]]
name = "staking-key-replay"
root = "RuntimeConformance.StakingKey"

# Canonical trie witness traversal and accounting-cache diagnostics.
[[lean_exe]]
name = "trie-replay"
root = "RuntimeConformance.Trie"
