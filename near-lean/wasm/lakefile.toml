# Wasm: the Wasm runtime of near-lean, written from the WebAssembly spec.
#
# Scope is the feature set nearcore enables (notes/design/WASM_RUNTIME.md):
# MVP, mutable globals, sign extension, saturating truncation, floats,
# reference types and bulk memory. No dependency beyond core Lean.
name = "Wasm"
version = "0.1.0"
defaultTargets = ["Wasm"]
packagesDir = "../.lake/packages"

[[lean_lib]]
name = "Wasm"

# Spec testsuite driver: `lake exe testsuite [PATTERN]`.
[[lean_exe]]
name = "testsuite"
root = "Testsuite.Main"

# Elaborators that embed a binary for kernel proofs (`byte_source%`, `ToExpr`
# for the module syntax), kept out of `Wasm`'s import closure.
[[lean_lib]]
name = "WasmEmbed"
roots = ["WasmEmbed.Embed"]

# Library half of the driver, kept out of `Wasm`'s import closure.
[[lean_lib]]
name = "Testsuite"
roots = ["Testsuite.Script"]

# Command-line front end: `lake exe wasm decode FILE.wasm`.
[[lean_exe]]
name = "wasm"
root = "Cli.Main"
